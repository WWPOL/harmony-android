name: Clean up releases and builds

# Removes what a publish leaves behind that nothing will read again:
#
#   * the APK of a release older than the newest few. The release and its changelog stay --
#     the page is the project's history -- and only the file it carries goes: a build is
#     reproducible from its commit, and the page is what is worth keeping;
#   * the rolling releases and tags of the scheme this replaced, one per branch, which are
#     the old files that made a downloader guess which one to take;
#   * Actions artifacts beyond the newest few. An artifact is the record of one run, it
#     expires on its own, and the release is the copy that outlives a run.
#
# It is a manual dispatch, never a push: deleting a published file is not something a build
# should do by accident. The default is a dry run that lists what it would delete.
#
# What it never touches: a release inside the kept window, a version tag, a commit tag, or
# the release either of them names. Those are `scripts/release.mjs`'s own rules, and
# `npm test` asserts them.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete what the run lists. Leave unchecked for a dry run.'
        type: boolean
        default: false
      keep-releases:
        description: 'How many of the newest releases keep their APK.'
        type: string
        default: '30'
      keep-artifacts:
        description: 'How many of the newest Actions artifacts to keep.'
        type: string
        default: '10'

# One run at a time, so two dispatches cannot try to delete the same file.
concurrency:
  group: cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Remove old release files, old rolling releases and old artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deleting a release asset and a tag is a write to the repository; deleting an artifact
    # is `actions: write`. Neither is granted to any other job in this repository.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: List, and delete when asked
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ inputs.apply }}
          KEEP_RELEASES: ${{ inputs.keep-releases }}
          KEEP_ARTIFACTS: ${{ inputs.keep-artifacts }}
        run: |
          args=(cleanup --keep-releases "${KEEP_RELEASES:-30}" --keep-artifacts "${KEEP_ARTIFACTS:-10}")
          if [ "$APPLY" = 'true' ]; then
            args+=(--apply)
          fi
          node scripts/release.mjs "${args[@]}" | tee cleanup.txt
          {
            echo "### Clean up releases and builds"
            echo ""
            echo '```'
            cat cleanup.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
