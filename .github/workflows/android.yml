name: Android build and checks

# The app. Every push builds it, whatever the branch, and publishes what it built: the
# per-run APK as an Actions artifact, and the newest build of each branch on a rolling
# release -- a release for the default branch, a prerelease for any other. Every published
# copy carries a signed build-provenance attestation naming the commit it was built from,
# which `gh attestation verify` checks. A version tag additionally puts the APK on that
# tag's release (release.yml).
#
# The release is the only published copy. Nothing here pushes a container package: an APK
# is not an image, and a package is not a download a phone can use.
#
# Trust: build and publish are separate jobs. The build job runs on pull requests too
# and holds no write permission. The publish job has contents: write and runs only on a
# push to a branch in this repository, so a fork's pull request can build but can never
# reach a token that writes. pull_request_target is not used anywhere here: it runs the
# base repository's token against a pull request's code. The attestation is created in
# the publish job for the same reason: signing a provenance statement is a write, and a
# pull request must not reach it.
on:
  # Every push, on every branch, with no path filter: the branch build is what a person
  # downloads to try the app, so a commit that changes nothing here must still produce the
  # APK of that commit rather than leave the previous one standing. Pull requests are
  # filtered: they build to check the app, and a change to a document has nothing to check.
  push:
    branches: ['**']
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'VERSION'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

# One run per ref: a newer push supersedes the older run's build, which is what a rolling
# release means. The publish job is not cancelled mid-flight by a newer push, though: it
# moves a stable asset name, and a publish cut off between uploading the new bytes and
# removing the old ones would leave both behind. The job is a few HTTP calls, so letting it
# finish costs nothing and keeps the release consistent.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; the publish job opts in for itself.
permissions:
  contents: read

env:
  # The branch whose build is published as the repository's release. Every other branch's
  # build is a prerelease, which the repository's Releases page and /releases/latest do not
  # offer.
  DEFAULT_BRANCH: main

jobs:
  # The tooling that names, checks and publishes APKs, run against a stand-in for the
  # GitHub API. It needs Node and nothing else, so it runs beside the build rather than
  # inside it.
  tooling:
    name: Release tooling and documentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The release tooling against a stand-in for the GitHub API, the workflows' own
      # invariants, doctor.sh, and every relative link in the documentation.
      - run: npm test

  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_TEST_KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 != '' }}
      # The stable test key's certificate SHA-256 fingerprint (repository variable, colon
      # separated as keytool prints it). It is a digest, not the key: publishing it lets a run
      # prove which certificate it signed with, and lets two APKs be compared without either.
      # It is the independent expectation the finished APK is checked against, so it is never
      # derived from the keystore the same run configured.
      TEST_KEY_SHA256: ${{ vars.ANDROID_TEST_KEY_SHA256 }}
    outputs:
      # The name the APK was given, the name of the artifact holding it, the commit it was
      # built from and its checksum: what a downloader needs to know what they have, and
      # what the publishing job needs to fetch those exact bytes.
      apk: ${{ steps.name.outputs.path }}
      artifact: ${{ steps.name.outputs.artifact }}
      sha256: ${{ steps.digest.outputs.sha256 }}
      version: ${{ steps.version.outputs.version }}
      version-name: ${{ steps.version.outputs.version-name }}
      version-code: ${{ steps.version.outputs.version-code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, not the one commit: the build number is the number of
          # commits reachable from this one (app/build.gradle.kts), and a shallow clone
          # would report 1 for every commit -- every build then claiming the same
          # versionCode, and a later build refused as a downgrade of an earlier one.
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      # Name the packages instead of taking the action's default, which is
      # `tools platform-tools`. cmdline-tools 16.0 does not carry `tools`, so the action
      # would fail inside itself before any step of this job runs.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'
      # A debug keystore is generated per checkout and therefore has a random certificate, so
      # two runs would sign with different keys and Android would refuse to install one over
      # the other. A repository secret can supply one stable test key instead; the APK is
      # still named -debug, because it is still a test key and never a release key. Without the
      # secret the builds are still produced, and the run says what that means.
      - name: Configure the test signing key
        if: env.HAS_TEST_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > test.keystore 2>/dev/null; then
            echo '::error::ANDROID_TEST_KEYSTORE_BASE64 is not valid base64. Regenerate it with: base64 -w 0 test.keystore'
            exit 1
          fi
          if ! keytool -list -keystore test.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo '::error::ANDROID_TEST_KEYSTORE_BASE64 decoded, but is not a keystore readable with ANDROID_TEST_KEYSTORE_PASSWORD.'
            exit 1
          fi
          # The key the build will sign with has to be the one the alias names, and the
          # keystore has to carry it: `keytool -list` above only proves the store opens. A
          # wrong ANDROID_TEST_KEY_ALIAS otherwise surfaced much later as an unsigned APK.
          if ! keytool -list -keystore test.keystore -storepass "$KEYSTORE_PASSWORD" \
                 -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::the keystore decodes, but has no key with alias '$KEY_ALIAS'. Check ANDROID_TEST_KEY_ALIAS."
            exit 1
          fi
          cat > test-keystore.properties <<EOF
          storeFile=test.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Note the test signing key
        if: env.HAS_TEST_KEYSTORE != 'true'
        run: |
          echo "::warning::No ANDROID_TEST_KEYSTORE_BASE64 secret: this APK is signed with a key generated for this checkout, whose certificate differs from every other run's. It installs on a device with no debug build of this app, but it will not install over one from another run."
          echo "::notice::For APKs that install over each other, add ANDROID_TEST_KEYSTORE_BASE64, ANDROID_TEST_KEYSTORE_PASSWORD, ANDROID_TEST_KEY_ALIAS and ANDROID_TEST_KEY_PASSWORD (a throwaway test key, never the release key). See docs/builds.md."
      # What this build reports, read from the same two places Gradle reads: VERSION for the
      # release line, and the commit for the build. The APK's own manifest is checked
      # against these below, so the number in the file name and the number inside the file
      # are one claim rather than two.
      - name: Read the version
        id: version
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION is not x.y.z: $version"
            exit 1
          fi
          # Gradle derives the code from git; this reads the same number for the job's
          # outputs and the manifest check, and fails if the clone cannot provide it.
          commits=$(git rev-list --count HEAD)
          if [ -z "$commits" ] || [ "$commits" -lt 1 ]; then
            echo '::error::the checkout has no commit history, so the build number cannot be derived (needs fetch-depth: 0)'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version-name=$version-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          # 2000000 is BUILD_NUMBER_BASE in app/build.gradle.kts. It is written out here
          # rather than read from the build so this is an independent expectation of what
          # the APK should report, and `npm test` asserts the two agree.
          echo "version-code=$((2000000 + commits))" >> "$GITHUB_OUTPUT"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
          echo "A build of ${GITHUB_SHA:0:7}: $version-${GITHUB_SHA:0:7} (versionCode $((2000000 + commits)), $commits commits)"
      # These are build, JVM and lint checks, NOT emulator or full-parity verification.
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain --max-workers=2
      # A debug APK is test-signed with the repository's debug key: installable, but not
      # an update of a release-signed install. The name says so (`-debug`).
      - name: Name the APK
        id: name
        env:
          # The name is the version the APK reports, which is what the check below reads
          # back out of the file. It is passed rather than computed again here, so a file
          # name and a manifest cannot disagree.
          APP_VERSION_NAME: ${{ steps.version.outputs.version-name }}
        run: |
          set -- app/build/outputs/apk/debug/*.apk
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one debug APK, found: $*"
            exit 1
          fi
          bash scripts/name-artifact.sh debug "$1"
      # What the file is, checked against the APK itself rather than trusted: the
      # package, the version it reports, and the key it is signed with. A build that
      # fails any of these is not published.
      - name: Check the APK and write its checksum
        id: digest
        run: |
          apk="${{ steps.name.outputs.path }}"
          # The runner can carry several build-tools; `.../build-tools/*/aapt2` would expand to
          # more than one path and run the first as the command. Take the newest explicitly.
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          # Written to a file and read from it: GitHub runs the step with `pipefail`, so
          # piping aapt2 into `head` would fail the step with SIGPIPE once aapt2 writes past
          # the first line.
          "${tools}aapt2" dump badging "$apk" > apk-badging.txt
          badging=$(head -1 apk-badging.txt)
          echo "$badging"
          case $badging in
            *"package: name='io.github.wwpol.brapmony'"*) ;;
            *) echo "::error::$apk is not the debug package this workflow builds"; exit 1 ;;
          esac
          # The version the file reports: the release line and the commit, with `-debug`
          # for the variant. This is the check that the number in the file name, the
          # number Android compares for an upgrade, and the number the app shows a person
          # are one number.
          case $badging in
            *"versionName='${{ steps.version.outputs.version-name }}-debug'"*) ;;
            *) echo "::error::$apk does not report version ${{ steps.version.outputs.version-name }}-debug"; exit 1 ;;
          esac
          case $badging in
            *"versionCode='${{ steps.version.outputs.version-code }}'"*) ;;
            *) echo "::error::$apk does not report versionCode ${{ steps.version.outputs.version-code }}"; exit 1 ;;
          esac
          "$tools"apksigner verify --print-certs "$apk" > apk-signature.txt
          # The certificate's SHA-256 fingerprint, not its subject: two different keys can
          # both say CN=Android Debug, and only the fingerprint says whether an APK will install
          # over another. The fingerprint goes in the artifact's metadata so two runs can be
          # compared, and is compared here when a stable key is configured.
          # apksigner prints lowercase hex; keytool prints uppercase hex in colon-separated
          # pairs. Both are the same digest, so both sides are reduced to bare lowercase hex
          # before they are compared.
          normalize() { printf '%s' "$1" | tr -d ':' | tr 'A-F' 'a-f'; }
          fingerprint=$(normalize "$(sed -n 's/^.*certificate SHA-256 digest: //p' apk-signature.txt | head -1)")
          if [ -z "$fingerprint" ]; then
            echo '::error::the APK is not signed, or its certificate has no SHA-256 fingerprint'
            cat apk-signature.txt
            exit 1
          fi
          echo "signing certificate SHA-256: $fingerprint"
          if [ "$HAS_TEST_KEYSTORE" = 'true' ]; then
            # Compared against the independently pinned ANDROID_TEST_KEY_SHA256, never
            # against whatever key the run happens to have configured: a check that reads
            # its expectation from the same secret it is checking proves only that the
            # secret agrees with itself. With the secret set and this pin absent, the
            # comparison would otherwise be against nothing and pass any certificate.
            expected_key=$(normalize "$TEST_KEY_SHA256")
            if [ -z "$expected_key" ]; then
              echo '::error::ANDROID_TEST_KEYSTORE_BASE64 is configured but ANDROID_TEST_KEY_SHA256 is not, so the APK cannot be proved to carry the stable test key. Set the repository variable to the certificate fingerprint (keytool -list -v, SHA256).'
              exit 1
            fi
            if [ "$fingerprint" != "$expected_key" ]; then
              echo "::error::the stable test key is configured (SHA-256 $expected_key), but the APK carries $fingerprint"
              exit 1
            fi
          fi
          # `sha256sum --check` reads `<hash>  <name>`: the line describes the file
          # beside it, so checking it works from any directory the APK is in.
          ( cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256" )
          sha256=$(cut -d' ' -f1 "$apk.sha256")
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          # The same facts again, for a person reading the artifact: the commit, the
          # version, and how it was signed.
          {
            echo "commit=${{ github.sha }}"
            echo "ref=${{ github.ref_name }}"
            echo "run=${{ github.run_id }}-${{ github.run_attempt }}"
            echo "version=${{ steps.version.outputs.version-name }}"
            echo "versionLine=${{ steps.version.outputs.version }}"
            echo "versionCode=${{ steps.version.outputs.version-code }}"
            echo "commits=${{ steps.version.outputs.commits }}"
            echo "sha256=$sha256"
            echo "signing=debug key (test only, not a production release)"
            echo "certificate-sha256=$fingerprint"
          } > "$apk.txt"
          cat "$apk.sha256" "$apk.txt"
      # The artifact carries the APK's own name, so what a run uploads and what a release
      # publishes are called the same thing. The namer adds `-attempt-<n>` on a re-run of
      # the same commit, so a second attempt's bytes never land on the first attempt's
      # name; that is what keeps the artifact immutable.
      #
      # 30 days, not 90: an artifact is the record of what a run built, and the release
      # carries the file people download for as long as the release exists. The build of
      # any commit can be rebuilt from that commit, so a quarter of storage per run buys
      # nothing. `cleanup` in scripts/release.mjs removes the ones that outlive it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: |
            ${{ steps.name.outputs.path }}
            ${{ steps.name.outputs.path }}.sha256
            ${{ steps.name.outputs.path }}.txt
          if-no-files-found: error
          retention-days: 30

  # Publishes the newest build of each branch, as a release of the default branch and as
  # a prerelease of any other. The default branch's is what the repository offers as its
  # release: the Releases box on the repository page and /releases/latest both reach a
  # release and skip a prerelease.
  #
  # A release is the whole of what this publishes. There is no package: an APK is not a
  # container image, and a package would only be a second place to look for the same file,
  # reachable with `oras` or `docker` rather than by tapping a link on a phone.
  #
  # What it publishes is attested: a signed build-provenance statement says which commit
  # and which workflow produced these bytes, and it is stored against the repository where
  # `gh attestation verify` can check it without trusting this workflow. The attestation
  # is created here rather than in the build job because signing is a write, and the build
  # job runs on pull requests.
  publish:
    name: Publish the release and its provenance
    needs: build
    # A push to a branch of this repository, and nothing else: a pull request from a fork
    # runs the build job only, with no token that can write.
    if: github.event_name == 'push' && github.repository == 'WWPOL/harmony-android'
    # Its own group, so a push that arrives while this runs does not cancel it; the newer
    # run's publish then replaces the stable names with its own, which is the point.
    concurrency:
      group: android-publish-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # The provenance attestation: id-token mints the short-lived Sigstore signing
      # certificate from this run's OIDC identity, and attestations stores the signed
      # statement against the repository. Neither is granted to the build job.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # The artifact is read-only evidence of what the build job produced; publishing
      # reads it back rather than rebuilding, so the published bytes are the checked bytes.
      # The download is checked against the digest GitHub recorded when the build uploaded
      # it (`digest-mismatch: error` is this action's default), so a transfer that changed
      # anything fails here rather than publishing bytes nobody built.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: android-apk
          digest-mismatch: error
      - name: Publish
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          VERSION_NAME: ${{ needs.build.outputs.version-name }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -- android-apk/*.apk
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one downloaded APK, found: $*"
            exit 1
          fi
          apk="$1"
          actual=$(sha256sum "$apk" | cut -d' ' -f1)
          if [ "$actual" != "$SHA256" ]; then
            echo "::error::The downloaded APK hashes to $actual, the build reported $SHA256"
            exit 1
          fi
          # What the attestation in this job is made about, and what the summary links to.
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          # The tag of the release this build goes on, from the one function that computes
          # it, so the download link in the release's own body names the release it is on.
          tag=$(node -e "import('./scripts/release.mjs').then(m => console.log(m.rollingTag(process.env.BRANCH)))")
          # The default branch's build is published as a release, which is what the
          # repository's Releases page and /releases/latest offer. Another branch's is a
          # prerelease: a branch build is not an offer to anybody.
          #
          # --version is the release line, and the body names the build by its commit: a
          # rolling release's title names the branch, not a version, because it carries a
          # different build every day. The body is written for the person deciding whether
          # to install: what the app is, how to install it, which build this is, and how to
          # check the file. What the rolling release *is* -- one per branch, ten builds
          # kept -- is in docs/builds.md, not repeated at a downloader.
          node scripts/release.mjs rolling --apk "$apk" \
            --branch "$BRANCH" --commit "$COMMIT" \
            --default-branch "$DEFAULT_BRANCH" --version "$VERSION" \
            --body "$(printf '%s\n' \
              "Brapmony is a native Android client for [Harmony](https://mony.lol): messages," \
              "servers, social, files, notifications and voice calls." \
              "" \
              "**[Download Brapmony-latest.apk](https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/Brapmony-latest.apk)**" \
              "" \
              "## Install" \
              "" \
              "1. Open it on the phone or tablet and tap the downloaded file." \
              "2. Allow the install when Android asks. The APK is test-signed, so Play Protect" \
              "   may warn." \
              "3. On first launch, enter your instance's address and sign in." \
              "" \
              "Over a cable: \`adb install -r Brapmony-latest.apk\`." \
              "" \
              "Android 8.0 (API 26) or newer. A signature mismatch means an older build signed" \
              "with a different key: uninstall it once." \
              "" \
              "## This build" \
              "" \
              "| | |" \
              "| --- | --- |" \
              "| Build | \`$VERSION_NAME\` (versionCode $VERSION_CODE) |" \
              "| Release line | $VERSION |" \
              "| Commit | [\`$COMMIT\`](https://github.com/$GITHUB_REPOSITORY/commit/$COMMIT) |" \
              "| Checksum | \`$SHA256\` |" \
              "" \
              "The other APK is this build under its commit's name, and never changes. This" \
              "release is a window on \`$BRANCH\`, keeping the ten newest builds; a named" \
              "release is cut from a version tag (\`vX.Y.Z\`)." \
              "" \
              "## Check the download" \
              "" \
              "With the GitHub CLI:" \
              "" \
              '```sh' \
              "gh attestation verify Brapmony-latest.apk --repo $GITHUB_REPOSITORY" \
              '```' \
              "" \
              "Or \`sha256sum -c Brapmony-latest.apk.sha256\`." \
              "" \
              "No end-to-end encryption, no push notifications, and several media and" \
              "administration flows are missing: not yet a drop-in replacement for the official" \
              "client. [The gap audit](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/parity-audit.md)" \
              "lists what is not there.")"
      # Provenance. The attestation is what binds these bytes to this commit: GitHub signs
      # a statement that this digest was produced by this workflow, in this repository, at
      # this commit, and keeps it where a downloader can check it. The subject is the APK
      # itself, so the check works on the file a person downloads.
      - name: Attest the APK's provenance
        id: attest-apk
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.publish.outputs.apk }}
      # The attestation is checked back from outside, the way a downloader checks it: by
      # its signature, the repository and workflow it names, and the commit it was built
      # from. A run that cannot produce an attestation that verifies fails here rather than
      # publishing a summary that claims provenance it does not have.
      #
      # A freshly created attestation can take a moment to be readable from the API, so
      # each check is retried a few times; anything else -- a signature that does not
      # verify, a different repository, workflow or commit -- is a failure that a retry
      # cannot fix, and it is retried anyway rather than parsed for, because the command's
      # exit status is the only thing this needs to know.
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.publish.outputs.apk }}
          COMMIT: ${{ github.sha }}
          WORKFLOW: ${{ github.repository }}/.github/workflows/android.yml
        run: |
          verify() {
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$1" \
                   --repo "$GITHUB_REPOSITORY" \
                   --signer-workflow "$WORKFLOW" \
                   --source-digest "$COMMIT" \
                   --deny-self-hosted-runners; then
                return 0
              fi
              echo "attempt $attempt: $2 did not verify yet"
              sleep 10
            done
            echo "::error::$2 has no attestation this workflow can verify for commit $COMMIT"
            return 1
          }
          verify "$APK" "$(basename "$APK")"
          echo "- Verified the provenance of \`$(basename "$APK")\`: signed for commit \`$COMMIT\` by \`$WORKFLOW\`." >> "$GITHUB_STEP_SUMMARY"
      # The link people are given is the tag-specific one -- it names the release, which
      # a browser can follow whether or not the release is the repository's newest. This
      # step fetches it back over the same path a browser would and checks that what
      # arrives is the APK that was just built: package, versionCode, certificate
      # fingerprint and checksum.
      - name: Check the published download
        env:
          BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_VERSION_NAME: ${{ needs.build.outputs.version-name }}
          EXPECTED_VERSION_CODE: ${{ needs.build.outputs.version-code }}
        run: |
          tag=$(node -e "import('./scripts/release.mjs').then(m => console.log(m.rollingTag(process.env.BRANCH)))")
          url="https://github.com/${{ github.repository }}/releases/download/$tag/Brapmony-latest.apk"
          echo "checking $url"
          # GitHub answers a download URL with a redirect to a signed blob; -L follows it.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL -o published.apk "$url"; then break; fi
            echo "attempt $attempt: not downloadable yet"; sleep 10
          done
          [ -s published.apk ] || { echo "::error::$url did not download"; exit 1; }
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          # To a file, not through a pipe: GitHub runs the step with `pipefail`, and aapt2
          # writing past the first line would fail the step with SIGPIPE (exit 141) once
          # `head` exits. The same reason the build job's digest step does it this way.
          "${tools}aapt2" dump badging published.apk > published-badging.txt
          badging=$(head -1 published-badging.txt)
          echo "$badging"
          case $badging in
            *"package: name='io.github.wwpol.brapmony'"*) ;;
            *) echo '::error::the published APK is not this app'; exit 1 ;;
          esac
          case $badging in
            *"versionName='$EXPECTED_VERSION_NAME-debug'"*) ;;
            *) echo "::error::the published APK does not report version $EXPECTED_VERSION_NAME-debug"; exit 1 ;;
          esac
          case $badging in
            *"versionCode='$EXPECTED_VERSION_CODE'"*) ;;
            *) echo "::error::the published APK is not versionCode $EXPECTED_VERSION_CODE"; exit 1 ;;
          esac
          actual=$(sha256sum published.apk | cut -d' ' -f1)
          [ "$actual" = "$EXPECTED_SHA256" ] || { echo "::error::the published APK hashes to $actual, the build reported $EXPECTED_SHA256"; exit 1; }
          # A file, not a pipe: apksigner writes several lines, and `head` closing the pipe
          # early fails the step with SIGPIPE under pipefail.
          "${tools}apksigner" verify --print-certs published.apk > published-signature.txt
          fingerprint=$(sed -n 's/^.*certificate SHA-256 digest: //p' published-signature.txt | head -1)
          [ -n "$fingerprint" ] || { echo '::error::the published APK is not signed'; exit 1; }
          echo "published APK: versionCode $EXPECTED_VERSION_CODE, sha256 $actual, certificate SHA-256 $fingerprint"
          echo "- Fetched the download back and checked it: package io.github.wwpol.brapmony, versionCode $EXPECTED_VERSION_CODE, sha256 $actual, certificate SHA-256 $fingerprint." >> "$GITHUB_STEP_SUMMARY"
      - name: Report the download links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          VERSION_NAME: ${{ needs.build.outputs.version-name }}
          VERSION_CODE: ${{ needs.build.outputs.version-code }}
          COMMIT: ${{ github.sha }}
        run: |
          tag=$(node -e "import('./scripts/release.mjs').then(m => console.log(m.rollingTag(process.env.BRANCH)))")
          {
            echo "### Brapmony \`$VERSION_NAME\`"
            echo ""
            echo "Newest build of \`$BRANCH\`; versionCode $VERSION_CODE, commit \`$COMMIT\`."
            echo ""
            echo "- [Brapmony-latest.apk](https://github.com/${{ github.repository }}/releases/download/$tag/Brapmony-latest.apk)"
            echo "- [The release](https://github.com/${{ github.repository }}/releases/tag/$tag)"
            echo "- [This run's artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- [The commit](https://github.com/${{ github.repository }}/commit/$COMMIT)"
            echo "- [The attestation](https://github.com/${{ github.repository }}/attestations)"
            echo ""
            echo "Test-signed, not store-signed."
          } >> "$GITHUB_STEP_SUMMARY"
