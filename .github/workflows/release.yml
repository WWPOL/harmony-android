name: Release

# Publishes the APK for a version tag, with a signed build-provenance attestation for it.
# Trigger: push a version tag (e.g. `git tag v1.9.6 && git push --tags`),
# or run manually and pass an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v1.9.6)"
        required: true

# One run per tag: a dispatch for a tag whose push run is still going waits.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

# Nothing here writes to the repository except the job that publishes the release.
permissions:
  contents: read

jobs:
  release:
    name: Build, attest and publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      # The tag's APK carries a signed build-provenance attestation, made from this run's
      # OIDC identity and stored against the repository: id-token mints the signing
      # certificate, attestations stores the statement.
      id-token: write
      attestations: write
    env:
      # Production signing is configured outside the tree. Absent, the build is
      # test-signed and its file name carries -debug, so a test-signed APK is never
      # passed off as a production one.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_TEST_KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The whole history: the build number is the commit count, so a shallow clone
          # would report 1 and a tag build would claim a lower versionCode than the branch
          # builds it has to install over.
          fetch-depth: 0
      # Helper scripts come from the workflow's own commit, so a dispatch can rebuild a
      # tag that predates a change to them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .ci/.nvmrc
      # The APK's version is the tag's: VERSION is stamped from it, and the tag has to be
      # the line the tagged commit carries. A tag that disagrees is refused rather than
      # publishing a file whose name says one version and whose contents say another: the
      # version line is bumped in a commit, and the tag goes on that commit.
      - name: Stamp the version from the tag
        id: version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          version=${TAG#v}
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the tag is not vX.Y.Z: $TAG"
            exit 1
          fi
          line=$(tr -d '[:space:]' < VERSION)
          if [ "$line" != "$version" ]; then
            echo "::error::the tag is $TAG, but the tagged commit's VERSION is $line. Bump VERSION to $version in a commit, and tag that commit."
            exit 1
          fi
          # The same number android.yml derives, from the same source: the build number is
          # the commit count, so a tag build and a branch build of one commit report the
          # same versionCode and Android treats them as one app.
          commits=$(git rev-list --count HEAD)
          if [ -z "$commits" ] || [ "$commits" -lt 1 ]; then
            echo '::error::the checkout has no commit history, so the build number cannot be derived'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # BUILD_NUMBER_BASE in app/build.gradle.kts, written out so this is an
          # independent expectation of what the APK should report rather than a number
          # read back from the thing it checks. `npm test` asserts the two agree.
          echo "version-code=$((2000000 + commits))" >> "$GITHUB_OUTPUT"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      # The action's default list carries `tools`, which cmdline-tools 16.0 does not ship, so
      # the list is named explicitly here too.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0'
      # keystore.properties names the store and its passwords and is gitignored; the secrets
      # are passed through env so a password cannot break the shell.
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > release.keystore 2>/dev/null; then
            echo '::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Regenerate it with: base64 -w 0 release.keystore'
            exit 1
          fi
          if ! keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo '::error::ANDROID_KEYSTORE_BASE64 decoded, but is not a keystore readable with ANDROID_KEYSTORE_PASSWORD.'
            exit 1
          fi
          # The alias has to name a key the store carries. `keytool -list` above only proves
          # the store opens, so without this a wrong ANDROID_KEY_ALIAS surfaced as a Gradle
          # signing failure after the whole build had run.
          if ! keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" \
                 -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::the keystore decodes, but has no key with alias '$KEY_ALIAS'. Check ANDROID_KEY_ALIAS."
            exit 1
          fi
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      # The same stable test key the branch builds use, so an APK from a tag installs over
      # one from a branch build and vice versa.
      - name: Configure the test signing key
        if: env.HAS_KEYSTORE != 'true' && env.HAS_TEST_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > test.keystore 2>/dev/null; then
            echo '::error::ANDROID_TEST_KEYSTORE_BASE64 is not valid base64. Regenerate it with: base64 -w 0 test.keystore'
            exit 1
          fi
          if ! keytool -list -keystore test.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo '::error::ANDROID_TEST_KEYSTORE_BASE64 decoded, but is not a keystore readable with ANDROID_TEST_KEYSTORE_PASSWORD.'
            exit 1
          fi
          # The alias has to name a key the keystore actually carries, or the build signs
          # with nothing and the failure surfaces much later.
          if ! keytool -list -keystore test.keystore -storepass "$KEYSTORE_PASSWORD" \
                 -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::the keystore decodes, but has no key with alias '$KEY_ALIAS'. Check ANDROID_TEST_KEY_ALIAS."
            exit 1
          fi
          cat > test-keystore.properties <<EOF
          storeFile=test.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Note the signing state
        run: |
          if [ "$HAS_KEYSTORE" = 'true' ]; then
            echo "::notice::Building a release-signed APK."
          elif [ "$HAS_TEST_KEYSTORE" = 'true' ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - the APK is signed with the repository's test key and named -debug. It installs over other test-signed builds, not over a release-signed install."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - the APK is signed with a key generated for this run and named -debug. It will not install over a build signed by any other run."
          fi
      # `-PharmonyReleaseBuild` makes the version name the plain release line rather than a
      # branch build's `<line>-<sha7>`: a tag's APK is the release, and its version name is
      # the release's name. The build number is still the commit count, so a tag build and a
      # branch build of the same commit are the same versionCode and install over each other.
      - name: Build the APK
        run: ./gradlew :app:assembleRelease :app:testReleaseUnitTest -PharmonyReleaseBuild=true --no-daemon --console=plain --max-workers=2
      # Named for what it is: `Brapmony-<version>.apk`, with `-debug` when the profile it
      # was signed with was the test key. Never the profile someone hoped it was.
      - name: Name the APK
        id: name
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
          GITHUB_SHA: ${{ github.sha }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          profile=$([ "$HAS_KEYSTORE" = 'true' ] && echo release || echo debug)
          set -- app/build/outputs/apk/release/*.apk
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Expected one release APK, found: $*"
            exit 1
          fi
          bash .ci/scripts/name-artifact.sh --release "$profile" "$1"
      - name: Check the APK and write its checksum
        run: |
          apk="${{ steps.name.outputs.path }}"
          # Several build-tools can be installed; take the newest rather than expanding a glob
          # into more than one command word.
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          # A file, not a pipe: GitHub runs the step with `pipefail`, and aapt2 writing
          # past the first line would fail it with SIGPIPE.
          "${tools}aapt2" dump badging "$apk" > apk-badging.txt
          badging=$(head -1 apk-badging.txt)
          echo "$badging"
          # The release variant reports the plain version whether or not it was signed with
          # the release key: `-debug` is appended only to the debug variant's version name. The
          # file name carries the signing state, and the signature check below enforces it.
          expected="versionName='${{ steps.version.outputs.version }}'"
          case $badging in
            *"package: name='io.github.wwpol.brapmony'"*) ;;
            *) echo "::error::$apk is not this app's package"; exit 1 ;;
          esac
          case $badging in
            *"$expected"*) ;;
            *) echo "::error::$apk does not report $expected"; exit 1 ;;
          esac
          # The release line is a name; the build number is what Android compares. Checked
          # too, so a tag's APK cannot be published with a code Android would refuse as a
          # downgrade of the branch build it is meant to replace.
          case $badging in
            *"versionCode='${{ steps.version.outputs.version-code }}'"*) ;;
            *) echo "::error::$apk does not report versionCode ${{ steps.version.outputs.version-code }}"; exit 1 ;;
          esac
          "$tools"apksigner verify --print-certs "$apk" > apk-signature.txt
          # The certificate's SHA-256 fingerprint, not its subject: two different keys can
          # both say CN=Android Debug, and only the fingerprint says whether an APK will install
          # over another. A keystore-signed build whose certificate is the test key's is a
          # mistake, and so is a test-signed build that is not the configured test key.
          # apksigner prints lowercase hex; keytool prints uppercase hex in colon-separated
          # pairs. Both are the same digest, so both sides are reduced to bare lowercase hex.
          normalize() { printf '%s' "$1" | tr -d ':' | tr 'A-F' 'a-f'; }
          fingerprint=$(normalize "$(sed -n 's/^.*certificate SHA-256 digest: //p' apk-signature.txt | head -1)")
          test_key=$(normalize "${{ vars.ANDROID_TEST_KEY_SHA256 }}")
          if [ -z "$fingerprint" ]; then
            echo '::error::the APK is not signed, or its certificate has no SHA-256 fingerprint'
            cat apk-signature.txt
            exit 1
          fi
          echo "signing certificate SHA-256: $fingerprint"
          if [ "$HAS_KEYSTORE" = 'true' ] && [ -n "$test_key" ] && [ "$fingerprint" = "$test_key" ]; then
            echo '::error::the release keystore is configured, but the APK carries the test key'
            exit 1
          fi
          if [ "$HAS_KEYSTORE" != 'true' ] && [ "$HAS_TEST_KEYSTORE" = 'true' ]; then
            # A test key without its fingerprint variable cannot be proved to be the one
            # that signed the APK, and a comparison against nothing passes anything.
            if [ -z "$test_key" ]; then
              echo '::error::ANDROID_TEST_KEYSTORE_BASE64 is configured but ANDROID_TEST_KEY_SHA256 is not, so the APK cannot be proved to carry the stable test key. Set the repository variable to the certificate fingerprint (keytool -list -v, SHA256).'
              exit 1
            fi
            if [ "$fingerprint" != "$test_key" ]; then
              echo '::error::the stable test key is configured, but the APK carries a different certificate'
              exit 1
            fi
          fi
          ( cd "$(dirname "$apk")" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256" )
          cat "$apk.sha256"
      # A tag's release is created or found by this job alone, so nothing races it. Uploads
      # replace only the two names this workflow owns.
      - name: Create or find the release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .ci/scripts/release.mjs tag --tag "$RELEASE_TAG" \
            --name "Brapmony ${{ steps.version.outputs.version }}" \
            --body "$(printf '%s\n' \
              "Brapmony ${{ steps.version.outputs.version }} for Android, a native client for" \
              "[Harmony](https://mony.lol) instances." \
              "" \
              "**[Download ${{ steps.name.outputs.stem }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/${{ steps.name.outputs.stem }}.apk)**" \
              "" \
              "## Install" \
              "" \
              "1. Open it on the phone or tablet and tap the downloaded file." \
              "2. Allow the install when Android asks. Unless a release key is configured, the" \
              "   APK is test-signed, so Play Protect may warn." \
              "3. On first launch, enter your instance's address and sign in." \
              "" \
              "Over a cable: \`adb install -r ${{ steps.name.outputs.stem }}.apk\`. Installing" \
              "over an older build keeps the app's data." \
              "" \
              "Android 8.0 (API 26) or newer. A signature mismatch means an older build signed" \
              "with a different key: uninstall it once." \
              "" \
              "## This build" \
              "" \
              "| | |" \
              "| --- | --- |" \
              "| Release | ${{ steps.version.outputs.version }} |" \
              "| Commit | [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |" \
              "| Checksum | \`$(cut -d' ' -f1 "${{ steps.name.outputs.path }}.sha256")\` |" \
              "" \
              "One APK for one version, kept as it is; the branch builds are elsewhere." \
              "[How builds are named and signed](https://github.com/${{ github.repository }}/blob/main/docs/builds.md)." \
              "" \
              "## Check the download" \
              "" \
              "With the GitHub CLI:" \
              "" \
              '```sh' \
              "gh attestation verify ${{ steps.name.outputs.stem }}.apk --repo ${{ github.repository }}" \
              '```' \
              "" \
              "Or \`sha256sum -c ${{ steps.name.outputs.stem }}.apk.sha256\`." \
              "" \
              "No end-to-end encryption, no push notifications, and several media and" \
              "administration flows are missing: not yet a drop-in replacement for the official" \
              "client. [The gap audit](https://github.com/${{ github.repository }}/blob/main/docs/parity-audit.md)" \
              "lists what is not there.")"
      - name: Attach the APK and its checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: node .ci/scripts/release.mjs upload --release-id "$RELEASE_ID" "${{ steps.name.outputs.path }}" "${{ steps.name.outputs.path }}.sha256"
      # Provenance, for the same bytes the release carries: the subject is the APK file, so
      # the check works on what a person downloads. GitHub signs a statement that this
      # digest was produced by this workflow, in this repository, at this tag's commit, and
      # keeps it against the repository.
      - name: Attest the APK's provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.name.outputs.path }}
      # Read back from outside, as a downloader would: the signature, the repository, the
      # workflow and the commit are all checked, so a release whose attestation does not
      # verify fails here rather than being described as attested. Retried a few times,
      # because a freshly created attestation can take a moment to be readable from the
      # API; a statement that names something else fails all the same.
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ steps.name.outputs.path }}
          COMMIT: ${{ github.sha }}
          WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: |
          verify() {
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$1" \
                   --repo "$GITHUB_REPOSITORY" \
                   --signer-workflow "$WORKFLOW" \
                   --source-digest "$COMMIT" \
                   --deny-self-hosted-runners; then
                return 0
              fi
              echo "attempt $attempt: $2 did not verify yet"
              sleep 10
            done
            echo "::error::$2 has no attestation this workflow can verify for commit $COMMIT"
            return 1
          }
          verify "$APK" "$(basename "$APK")"
          {
            echo "- Attested and verified the provenance of \`$(basename "$APK")\`: signed for commit \`$COMMIT\` by \`$WORKFLOW\`."
            echo "- [The release](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG) · [the attestations](https://github.com/$GITHUB_REPOSITORY/attestations)"
          } >> "$GITHUB_STEP_SUMMARY"
